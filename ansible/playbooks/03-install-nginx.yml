---
# Run: ansible-playbook ansible/playbooks/03-install-nginx.yml
# Check mode (dry-run): ansible-playbook ansible/playbooks/03-install-nginx.yml --check --diff
# Specific tags: ansible-playbook ansible/playbooks/03-install-nginx.yml --tags config
- name: "Lab 03 — Install and configure nginx on webservers"
  hosts: webservers
  become: true

  vars:
    app_name: "DevOps Training App"
    server_admin: "admin@company.com"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [install]

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
      notify: Start nginx
      tags: [install]

    - name: Deploy nginx config from template
      ansible.builtin.template:
        src: /workspace/ansible/templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Reload nginx
      tags: [config]

    - name: Create document root
      ansible.builtin.file:
        path: "{{ document_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      tags: [config]

    - name: Deploy index page
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>{{ app_name }}</title></head>
          <body>
            <h1>{{ app_name }}</h1>
            <p>Server: {{ inventory_hostname }} | Port: {{ http_port }}</p>
            <p>IP: {{ ansible_default_ipv4.address }}</p>
            <p>Managed by Ansible | {{ ansible_date_time.date }}</p>
          </body>
          </html>
        dest: "{{ document_root }}/index.html"
        mode: "0644"
      tags: [content]

    - name: Ensure nginx started and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: [service]

    - name: Verify nginx responds
      ansible.builtin.uri:
        url: "http://localhost:{{ http_port }}"
        status_code: 200
      register: nginx_result
      tags: [verify]

    - name: Show nginx status
      ansible.builtin.debug:
        msg: "nginx on {{ inventory_hostname }}:{{ http_port }} → HTTP {{ nginx_result.status }}"
      tags: [verify]

  handlers:
    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
