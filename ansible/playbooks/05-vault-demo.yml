---
# Run: ansible-playbook ansible/playbooks/05-vault-demo.yml --ask-vault-pass
# Vault password for this demo: training123
- name: "Lab 05 — Ansible Vault demonstration"
  hosts: webservers
  become: true

  vars_files:
    - /workspace/ansible/vault/secrets.yml

  tasks:
    - name: Show non-secret variable
      ansible.builtin.debug:
        msg: "DB Host: {{ db_host }} | DB Name: {{ db_name }}"

    - name: Create config file with secret (no_log hides password in output)
      ansible.builtin.copy:
        content: |
          DB_HOST={{ db_host }}
          DB_NAME={{ db_name }}
          DB_USER={{ db_user }}
          DB_PASS={{ db_password }}
        dest: /tmp/db_config.env
        mode: '0600'
      no_log: true

    - name: Verify file was created
      ansible.builtin.stat:
        path: /tmp/db_config.env
      register: config_stat

    - name: Show result (not contents)
      ansible.builtin.debug:
        msg: "Config file created: {{ config_stat.stat.exists }} | Size: {{ config_stat.stat.size }} bytes"
